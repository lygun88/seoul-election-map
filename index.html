<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
<title>서울시 행정동별 1위 후보 득표율</title>
<style>
  :root { --panel-bg: rgba(255,255,255,.96); --border:#d8d8d8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:#fafafa; color:#111; }
  body { overflow:hidden; }
  #wrap { height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 12px 8px; background:var(--panel-bg); border-bottom:1px solid var(--border); z-index:3; }
  h1 { margin:0 0 5px; font-size:18px; line-height:1.25; }
  .desc { margin:0; color:#555; font-size:12px; line-height:1.45; }
  .tabs { display:flex; gap:6px; align-items:center; margin-top:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:1px; }
  .tab-btn { flex:0 0 auto; border:1px solid #bbb; background:#fff; color:#222; border-radius:999px; padding:7px 12px; font-weight:800; font-size:12px; }
  .tab-btn.active { background:#111; color:#fff; border-color:#111; }
  #mapBox { position:relative; flex:1; min-height:0; }
  #mapBox.hidden { display:none; }
  #rankBox { display:none; flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; padding:10px 12px 24px; background:#fafafa; }
  #rankBox.active { display:block; }
  .rank-summary { margin:0 0 10px; color:#555; font-size:12px; line-height:1.45; }
  .rank-candidate-tabs { display:flex; gap:6px; margin:0 0 10px; position:sticky; top:0; background:#fafafa; padding-bottom:8px; z-index:1; }
  .rank-candidate-btn { flex:1; border:1px solid #bbb; background:#fff; color:#222; border-radius:10px; padding:9px 10px; font-weight:900; font-size:13px; }
  .rank-candidate-btn.active { background:#111; color:#fff; border-color:#111; }
  .rank-list { display:flex; flex-direction:column; gap:6px; }
  .rank-row { width:100%; border:1px solid var(--border); background:#fff; border-radius:10px; padding:9px 10px; display:grid; grid-template-columns:42px 1fr auto; gap:8px; align-items:center; text-align:left; box-shadow:0 1px 8px rgba(0,0,0,.04); }
  .rank-no { font-weight:900; color:#555; font-size:12px; }
  .rank-main b { display:block; font-size:13px; line-height:1.25; }
  .rank-main em { display:block; margin-top:2px; color:#666; font-size:11px; font-style:normal; }
  .rank-rate { font-weight:900; font-size:14px; white-space:nowrap; }
  #map { width:100%; height:100%; display:block; background:#fff; touch-action:none; }
  .legend { position:absolute; right:10px; top:10px; background:var(--panel-bg); border:1px solid var(--border); padding:7px 9px; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.08); font-size:11px; max-width:172px; z-index:2; }
  .legend-row { display:flex; align-items:center; gap:7px; margin:5px 0; white-space:nowrap; }
  .swatch { width:16px; height:11px; border:1px solid rgba(0,0,0,.45); flex:0 0 auto; }
  .line-swatch { width:18px; height:0; border-top:3px solid #55aee0; flex:0 0 auto; }
  .gu-swatch { border-top-color:#2d2d2d; border-top-style:double; }
  .river-layer path { fill:none; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
  .gu-boundary-layer path { fill:none; stroke:#2f2f2f; stroke-opacity:.82; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
  .gu-label { pointer-events:none; font-weight:900; font-size:13px; text-anchor:middle; dominant-baseline:central; fill:rgba(20,20,20,.72); paint-order:stroke; stroke:white; stroke-width:4.2px; stroke-linejoin:round; letter-spacing:-.04em; }
  .river-label { pointer-events:none; font-weight:900; font-size:12px; text-anchor:middle; dominant-baseline:central; fill:#166d9e; paint-order:stroke; stroke:white; stroke-width:3.4px; stroke-linejoin:round; }
  .label { pointer-events:auto; cursor:pointer; }
  .dong-label { font-weight:800; font-size:10.5px; text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:white; stroke-width:3.2px; stroke-linejoin:round; }
  .rate-label { font-weight:900; font-size:11px; text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:white; stroke-width:3.3px; stroke-linejoin:round; }
  .rate-only { font-weight:900; font-size:11px; text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:white; stroke-width:3.2px; stroke-linejoin:round; }
  #infoPanel { position:absolute; left:10px; right:10px; bottom:10px; background:var(--panel-bg); border:1px solid var(--border); border-radius:12px; padding:11px 12px; box-shadow:0 4px 22px rgba(0,0,0,.18); z-index:4; display:none; font-size:13px; line-height:1.45; }
  #infoPanel b { font-size:15px; }
  #closePanel { position:absolute; right:8px; top:6px; border:0; background:transparent; font-size:18px; line-height:1; padding:4px; }
  .tooltip { position:fixed; pointer-events:none; background:#111; color:white; padding:8px 10px; border-radius:7px; font-size:13px; opacity:0; line-height:1.45; z-index:20; }
  .loading { position:absolute; left:12px; top:12px; background:var(--panel-bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px; z-index:2; }
  @media (max-width: 720px) {
    header { padding:9px 10px 7px; }
    h1 { font-size:16px; }
    .desc { font-size:11.5px; }
    .legend { top:8px; right:8px; font-size:10.5px; padding:6px 8px; max-width:150px; }
    .rank-row { grid-template-columns:36px 1fr auto; padding:8px 9px; }
    .rank-main b { font-size:12.5px; }
    .rank-rate { font-size:13px; }
    .dong-label { font-size:10px; }
    .rate-label, .rate-only { font-size:10.6px; }
    .gu-label { font-size:11px; stroke-width:3.8px; }
    .river-label { font-size:10px; stroke-width:3px; }
  }
</style>
</head>

<div id="wrap">
  <header>
    <h1>서울시 행정동별 1위 후보 득표율</h1>
    <p class="desc">모바일 가독성을 위해 <b>겹치지 않는 라벨만 자동 표시</b>합니다. 한강·주요 하천과 구 경계를 함께 표시해 위치 판별이 쉽도록 보완했습니다.</p>
    <div class="tabs" aria-label="화면 전환">
      <button id="tabMap" class="tab-btn active">지도</button>
      <button id="tabRank" class="tab-btn">득표율 순위</button>
    </div>
  </header>
  <div id="mapBox">
    <svg id="map"></svg>
    <div class="legend" id="legend"></div>
    <div class="loading" id="loading">지도 경계 불러오는 중...</div>
    <div id="infoPanel"><button id="closePanel" aria-label="닫기">×</button><div id="infoBody"></div></div>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <div id="rankBox" aria-label="후보별 동별 1위 득표율 순위">
    <p id="rankSummary" class="rank-summary">후보를 선택하면 해당 후보가 1위인 동의 득표율 순위를 볼 수 있습니다. 행을 누르면 지도에서 해당 동으로 이동합니다.</p>
    <div class="rank-candidate-tabs" aria-label="후보별 순위 선택">
      <button id="rankOh" class="rank-candidate-btn active" type="button">오세훈 순위</button>
      <button id="rankJung" class="rank-candidate-btn" type="button">정원오 순위</button>
    </div>
    <div id="rankList" class="rank-list"></div>
  </div>
</div>

  byKey.set(norm(d.key), d);
  byKey.set(norm('서울특별시 ' + d.gu + ' ' + d.dong), d);
});
const svg = d3.select('#map');
const tooltip = d3.select('#tooltip');
const legend = d3.select('#legend');
const loading = d3.select('#loading');
const infoPanel = d3.select('#infoPanel');
const infoBody = d3.select('#infoBody');
const rankBox = d3.select('#rankBox');
const rankSummary = d3.select('#rankSummary');
const rankList = d3.select('#rankList');
const rankOh = d3.select('#rankOh');
const rankJung = d3.select('#rankJung');
const mapBox = d3.select('#mapBox');
const tabMap = d3.select('#tabMap');
const tabRank = d3.select('#tabRank');
legend.html('<b>범례</b>'
  + candidateOrder.map(c => `<div class="legend-row"><span class="swatch" style="background:${COLORS[c.party]}"></span>${c.name}</div>`).join('')
  + '<div class="legend-row"><span class="line-swatch"></span>한강·주요하천</div>'
  + '<div class="legend-row"><span class="line-swatch gu-swatch"></span>구 경계</div>');
function popupHtml(d) {
  if (!d) return '선거 데이터 매칭 없음';
  return `<b>${d.gu} ${d.dong}</b><br>${d.winnerParty} ${d.winnerName}<br>득표율: ${d.winnerRate.toFixed(1)}%<br>득표수: ${d.winnerVotes.toLocaleString()}표<br><span style="color:#666">유효득표: ${d.validVotes.toLocaleString()}표</span>`;
}
function showInfo(d) {
  infoBody.html(popupHtml(d));
  infoPanel.style('display', 'block');
}
d3.select('#closePanel').on('click', () => infoPanel.style('display', 'none'));
let pendingFocusKey = null;
function switchTab(tab) {
  const isRank = tab === 'rank';
  tabMap.classed('active', !isRank);
  tabRank.classed('active', isRank);
  mapBox.classed('hidden', isRank);
  rankBox.classed('active', isRank);
  if (!isRank) updateLabels(currentTransform);
}
d3.select('#tabMap').on('click', () => switchTab('map'));
d3.select('#tabRank').on('click', () => switchTab('rank'));
let currentRankCandidate = '오세훈';
function setRankCandidate(name) {
  currentRankCandidate = name;
  rankOh.classed('active', name === '오세훈');
  rankJung.classed('active', name === '정원오');
  buildRankList();
}
rankOh.on('click', () => setRankCandidate('오세훈'));
rankJung.on('click', () => setRankCandidate('정원오'));
function buildRankList() {
  const rows = DATA
    .filter(d => d.winnerName === currentRankCandidate)
    .slice()
    .sort((a, b) => d3.descending(a.winnerRate, b.winnerRate));
  const title = `${currentRankCandidate} 1위 동 ${rows.length.toLocaleString()}개`;
  rankSummary.text(`${title}를 득표율 높은 순서로 정렬했습니다. 행을 누르면 지도에서 해당 동으로 이동합니다.`);
  rankList.selectAll('button.rank-row')
    .data(rows, d => d.key)
    .join(
      enter => enter.append('button')
        .attr('class', 'rank-row')
        .attr('type', 'button')
        .on('click', (event, d) => focusRegionByData(d)),
      update => update,
      exit => exit.remove()
    )
    .html((d, i) => `<span class="rank-no">${i + 1}위</span><span class="rank-main"><b>${d.gu} ${d.dong}</b><em>${d.winnerParty} · ${d.winnerVotes.toLocaleString()}표</em></span><span class="rank-rate">${d.winnerRate.toFixed(1)}%</span>`);
}
function focusRegionByData(d) {
  const row = featureRows.find(r => r.data && r.data.key === d.key);
  if (!row || !zoomBehavior) { pendingFocusKey = d.key; switchTab('map'); return; }
  switchTab('map');
  showInfo(d);
  const width = svg.node().clientWidth;
  const height = svg.node().clientHeight;
  const targetK = Math.max(currentTransform.k || 1, 6);
  const target = d3.zoomIdentity.translate(width / 2 - targetK * row.cx, height / 2 - targetK * row.cy).scale(targetK);
  svg.transition().duration(550).call(zoomBehavior.transform, target);
}
buildRankList();
let labelMode = 'full';
let zoomBehavior;
let currentTransform = d3.zoomIdentity;
let featureRows = [];
let guRows = [];
let riverLabelRows = [];
let guLabelSelection = null;
let riverLabelSelection = null;
function textWidth(s, size) {
  let w = 0;
  for (const ch of String(s || '')) {
    if (/[0-9.%]/.test(ch)) w += size * 0.58;
    else if (/[A-Za-z]/.test(ch)) w += size * 0.55;
    else w += size * 0.92;
  }
  return w + 8;
}
function overlap(a,b) { return !(a.x2 < b.x1 || a.x1 > b.x2 || a.y2 < b.y1 || a.y1 > b.y2); }
function updateLabels(t) {
  currentTransform = t;
  if (!featureRows.length) return;
  const width = svg.node().clientWidth;
  const height = svg.node().clientHeight;
  if (labelMode === 'off') {
    d3.selectAll('.label').style('display', 'none');
    return;
  }
  const isSmall = width < 760;
  const boxes = [];
  let shown = 0;
  const margin = isSmall ? 4 : 6;
  const maxLabels = labelMode === 'rate' ? (isSmall ? 170 : 260) : (isSmall ? 95 : 155);
  const rows = featureRows.map(r => {
    const x = t.applyX(r.cx), y = t.applyY(r.cy);
    const d = r.data;
    const rateText = d ? `${d.winnerRate.toFixed(1)}%` : '';
    const displayMode = labelMode;
    let w = displayMode === 'rate' ? textWidth(rateText, 11) : Math.max(textWidth(d?.dong || '', 10.5), textWidth(rateText, 11));
    let h = displayMode === 'rate' ? 17 : 28;
    return {...r, sx:x, sy:y, w, h, displayMode};
  }).filter(r => r.data && r.sx > -40 && r.sx < width + 40 && r.sy > -40 && r.sy < height + 40);
  // 지도 중심에 가까운 라벨부터 배치하면 현재 보고 있는 영역이 우선 표시됩니다.
  rows.sort((a,b) => {
    const da = Math.hypot(a.sx - width/2, a.sy - height/2);
    const db = Math.hypot(b.sx - width/2, b.sy - height/2);
    return da - db;
  });
  for (const r of rows) {
    if (shown >= maxLabels) { r.visible = false; continue; }
    const box = {x1:r.sx-r.w/2-margin, x2:r.sx+r.w/2+margin, y1:r.sy-r.h/2-margin, y2:r.sy+r.h/2+margin};
    if (boxes.some(b => overlap(box,b))) { r.visible = false; }
    else { r.visible = true; boxes.push(box); shown++; }
  }
  const visible = new Set(rows.filter(r => r.visible).map(r => r.id));
  const rowById = new Map(rows.map(r => [r.id, r]));
  d3.selectAll('.label').each(function(r) {
    const rr = rowById.get(r.id);
    if (!rr || !visible.has(r.id)) { d3.select(this).style('display', 'none'); return; }
    const sel = d3.select(this);
    sel.style('display', null).attr('transform', `translate(${rr.sx},${rr.sy})`);
    sel.select('.dong-label').style('display', labelMode === 'full' ? null : 'none');
    sel.select('.rate-label').style('display', labelMode === 'full' ? null : 'none');
    sel.select('.rate-only').style('display', labelMode === 'rate' ? null : 'none');
  });
  updateReferenceLabels(t);
}
function updateReferenceLabels(t) {
  const width = svg.node().clientWidth;
  const height = svg.node().clientHeight;
  const isSmall = width < 720;
  if (guLabelSelection) {
    guLabelSelection
      .attr('transform', r => `translate(${t.applyX(r.cx)},${t.applyY(r.cy)})`)
      .style('display', r => {
        const x = t.applyX(r.cx), y = t.applyY(r.cy);
        return (x < -25 || x > width + 25 || y < -20 || y > height + 20) ? 'none' : null;
      })
      .style('opacity', isSmall && t.k < 1.35 ? 0.70 : 0.86);
  }
  if (riverLabelSelection) {
    riverLabelSelection
      .attr('transform', r => `translate(${t.applyX(r.cx)},${t.applyY(r.cy)})`)
      .style('display', r => {
        if (r.type !== 'main' && isSmall && t.k < 2.2) return 'none';
        if (r.type !== 'main' && !isSmall && t.k < 1.35) return 'none';
        const x = t.applyX(r.cx), y = t.applyY(r.cy);
        return (x < -35 || x > width + 35 || y < -25 || y > height + 25) ? 'none' : null;
      });
  }
}
function render(geo) {
  loading.style('display', 'none');
  const width = svg.node().clientWidth;
  const height = svg.node().clientHeight;
  svg.selectAll('*').remove();
  svg.attr('viewBox', [0, 0, width, height]);
  const seoul = { type:'FeatureCollection', features: geo.features.filter(f => String(f.properties.adm_nm || '').startsWith('서울특별시')) };
  const projection = d3.geoMercator().fitSize([width, height], seoul);
  const path = d3.geoPath(projection);
  const mapLayer = svg.append('g').attr('class','map-layer');
  const dongLayer = mapLayer.append('g').attr('class','dong-layer');
  const riverLayer = mapLayer.append('g').attr('class','river-layer');
  const guBoundaryLayer = mapLayer.append('g').attr('class','gu-boundary-layer');
  const guLabelLayer = svg.append('g').attr('class','gu-label-layer');
  const riverLabelLayer = svg.append('g').attr('class','river-label-layer');
  const labelLayer = svg.append('g').attr('class','label-layer');
  featureRows = seoul.features.map((f, i) => {
    const c = path.centroid(f);
    const d = byKey.get(norm(f.properties.adm_nm));
    return {id:i, feature:f, data:d, cx:c[0], cy:c[1]};
  });
  guRows = buildGuBoundaryRows(seoul.features, path);
  riverLabelRows = RIVERS.map(r => ({...r, cx:projection(r.labelCoord)[0], cy:projection(r.labelCoord)[1]}));
  const dongPaths = dongLayer.selectAll('path')
    .data(featureRows)
    .join('path')
    .attr('d', r => path(r.feature))
    .attr('fill', r => r.data ? COLORS[r.data.winnerParty] : '#eeeeee')
    .attr('stroke', '#fff')
    .attr('stroke-width', 0.55)
    .on('mousemove', (event, r) => {
      if (window.matchMedia('(hover:hover)').matches) {
        tooltip.style('opacity', 0.94).style('left', (event.clientX + 12) + 'px').style('top', (event.clientY + 12) + 'px').html(popupHtml(r.data));
      }
    })
    .on('mouseleave', () => tooltip.style('opacity', 0))
    .on('click', (event, r) => { event.stopPropagation(); showInfo(r.data); });
  const riverPaths = riverLayer.selectAll('path')
    .data(RIVERS)
    .join('path')
    .attr('d', r => path({type:'Feature', properties:r, geometry:{type:'LineString', coordinates:r.coords}}))
    .attr('stroke', r => r.type === 'main' ? '#58b6e6' : '#83c9ee')
    .attr('stroke-opacity', r => r.type === 'main' ? 0.90 : 0.78)
    .attr('stroke-width', r => r.type === 'main' ? 4.8 : 2.4);
  const guBoundaryPaths = guBoundaryLayer.selectAll('path')
    .data(guRows)
    .join('path')
    .attr('d', r => path(r.feature))
    .attr('stroke-width', 1.45);
  guLabelSelection = guLabelLayer.selectAll('text.gu-label')
    .data(guRows)
    .join('text')
    .attr('class','gu-label')
    .text(r => r.gu);
  riverLabelSelection = riverLabelLayer.selectAll('text.river-label')
    .data(riverLabelRows)
    .join('text')
    .attr('class','river-label')
    .text(r => r.name);
  const labels = labelLayer.selectAll('g.label')
    .data(featureRows)
    .join('g')
    .attr('class','label')
    .on('click', (event, r) => { event.stopPropagation(); showInfo(r.data); });
  labels.append('text').attr('class','dong-label').attr('y', -6).attr('fill','#111').text(r => r.data ? r.data.dong : '');
  labels.append('text').attr('class','rate-label').attr('y', 6.5).attr('fill','#111').text(r => r.data ? `${r.data.winnerRate.toFixed(1)}%` : '');
  labels.append('text').attr('class','rate-only').attr('y', 0).attr('fill','#111').text(r => r.data ? `${r.data.winnerRate.toFixed(1)}%` : '');
  zoomBehavior = d3.zoom().scaleExtent([1, 14]).on('zoom', (event) => {
    currentTransform = event.transform;
    const k = event.transform.k;
    mapLayer.attr('transform', event.transform);
    dongPaths.attr('stroke-width', Math.max(0.08, 0.55 / k));
    riverPaths.attr('stroke-width', r => (r.type === 'main' ? 4.8 : 2.4) / Math.sqrt(k));
    guBoundaryPaths.attr('stroke-width', Math.max(0.22, 1.45 / Math.sqrt(k)));
    updateLabels(event.transform);
  });
  svg.call(zoomBehavior).on('click', () => infoPanel.style('display', 'none'));
  updateLabels(d3.zoomIdentity);
  if (pendingFocusKey) {
    const d = DATA.find(x => x.key === pendingFocusKey);
    pendingFocusKey = null;
    if (d) focusRegionByData(d);
  }
}
d3.json(boundaryUrl).then(render).catch(err => {
  loading.style('display','none');
  svg.append('text').attr('x', 24).attr('y', 48).attr('font-size', 15).text('경계 GeoJSON을 불러오지 못했습니다: ' + err);
});
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => location.reload(), 250);
});
</script>
