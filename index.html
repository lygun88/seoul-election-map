function norm(s) { return String(s || '').replace(/\s+/g,'').replace(/제(?=\d)/g,''); }
const byKey = new Map();
DATA.forEach(d => {
  byKey.set(norm(d.key), d);
  byKey.set(norm('서울특별시 ' + d.gu + ' ' + d.dong), d);
});
function popupHtml(d) {
  if (!d) return '선거 데이터 매칭 없음';
  return `<b>${d.gu} ${d.dong}</b><br>${d.winnerParty} ${d.winnerName}<br>득표율: ${d.winnerRate.toFixed(1)}%<br>득표수: ${d.winnerVotes.toLocaleString()}표<br><small>유효득표: ${d.validVotes.toLocaleString()}표</small>`;
}
const svg = d3.select('#map');
const tooltip = d3.select('#tooltip');
const legend = d3.select('#legend');
legend.html('<b>범례</b>' + candidateOrder.map(c => `<div class="legend-row"><span class="swatch" style="background:${COLORS[c.party]}"></span>${c.party} ${c.name}</div>`).join('') + '<small>회색: 경계명과 선거 데이터 미매칭</small>');
function render(geo) {
  const width = svg.node().clientWidth;
  const height = svg.node().clientHeight;
  svg.attr('viewBox', [0, 0, width, height]);
  const seoul = { type:'FeatureCollection', features: geo.features.filter(f => String(f.properties.adm_nm || '').startsWith('서울특별시')) };
  const projection = d3.geoMercator().fitSize([width, height], seoul);
  const path = d3.geoPath(projection);
  const g = svg.append('g');
  const features = seoul.features;
  g.selectAll('path')
    .data(features)
    .join('path')
    .attr('d', path)
    .attr('fill', f => {
      const d = byKey.get(norm(f.properties.adm_nm));
      return d ? COLORS[d.winnerParty] : '#eeeeee';
    })
    .attr('stroke', '#fff')
    .attr('stroke-width', 0.55)
    .on('mousemove', (event, f) => {
      const d = byKey.get(norm(f.properties.adm_nm));
      tooltip.style('opacity', 0.94)
        .style('left', (event.clientX + 12) + 'px')
        .style('top', (event.clientY + 12) + 'px')
        .html(popupHtml(d));
    })
    .on('mouseleave', () => tooltip.style('opacity', 0));
  const labels = g.selectAll('g.label')
    .data(features)
    .join('g')
    .attr('class', 'label')
    .attr('transform', f => `translate(${path.centroid(f)[0]},${path.centroid(f)[1]})`);
  labels.append('text')
    .attr('class', 'dong-label')
    .attr('y', -4.3)
    .attr('fill', '#111')
    .text(f => {
      const d = byKey.get(norm(f.properties.adm_nm));
      return d ? d.dong : '';
    });
  labels.append('text')
    .attr('class', 'rate-label')
    .attr('y', 4.9)
    .attr('fill', '#111')
    .text(f => {
      const d = byKey.get(norm(f.properties.adm_nm));
      return d ? `${d.winnerRate.toFixed(1)}%` : '';
    });
  const zoom = d3.zoom().scaleExtent([1, 9]).on('zoom', (event) => {
    g.attr('transform', event.transform);
    g.selectAll('path').attr('stroke-width', 0.55 / event.transform.k);
    g.selectAll('.dong-label').style('font-size', Math.max(4.8, 7.2 / Math.sqrt(event.transform.k)) + 'px')
      .style('stroke-width', Math.max(0.8, 2.1 / Math.sqrt(event.transform.k)) + 'px');
    g.selectAll('.rate-label').style('font-size', Math.max(5.0, 7.6 / Math.sqrt(event.transform.k)) + 'px')
      .style('stroke-width', Math.max(0.8, 2.2 / Math.sqrt(event.transform.k)) + 'px');
  });
  svg.call(zoom);
}
d3.json(boundaryUrl).then(render).catch(err => {
  svg.append('text').attr('x', 30).attr('y', 50).attr('font-size', 16).text('경계 GeoJSON을 불러오지 못했습니다: ' + err);
});
</script>
</body></html>
